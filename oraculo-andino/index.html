<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oráculo Andino — Lectura de Cartas</title>
  <style>
    :root {
      --fondo: #120c0a;
      --fondo-suave: #1c1410;
      --cochinilla: #9b1b2e;
      --cochinilla-clara: #c43a4a;
      --ocre: #c4a35a;
      --ocre-suave: #e0c888;
      --turquesa: #2a8a8a;
      --turquesa-clara: #3eb5b0;
      --hueso: #f2ebe0;
      --hueso-tenue: #cfc4b4;
      --sombra: rgba(0, 0, 0, 0.55);
      --carta-w: 160px;
      --carta-h: 250px;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
      color: var(--hueso);
      background:
        radial-gradient(ellipse at 20% 0%, rgba(154, 27, 46, 0.18), transparent 45%),
        radial-gradient(ellipse at 90% 20%, rgba(42, 138, 138, 0.12), transparent 40%),
        radial-gradient(ellipse at 50% 100%, rgba(196, 163, 90, 0.1), transparent 50%),
        var(--fondo);
      line-height: 1.5;
    }

    /* Textil de fondo sutil */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.045;
      background-image:
        linear-gradient(90deg, var(--ocre) 1px, transparent 1px),
        linear-gradient(var(--ocre) 1px, transparent 1px);
      background-size: 24px 24px;
      z-index: 0;
    }

    .wrap {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 1.5rem 1.1rem 2.5rem;
    }

    /* ——— Encabezado ——— */
    header {
      text-align: center;
      margin-bottom: 1.75rem;
      padding-bottom: 1.25rem;
      border-bottom: 2px solid var(--ocre);
      position: relative;
    }

    header::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -6px;
      transform: translateX(-50%);
      width: 48px;
      height: 8px;
      background:
        linear-gradient(90deg,
          transparent 0 8px, var(--cochinilla) 8px 16px,
          transparent 16px 24px, var(--turquesa) 24px 32px,
          transparent 32px 40px, var(--ocre) 40px 48px);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.65rem;
      margin-bottom: 0.4rem;
    }

    .brand svg {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    h1 {
      font-size: clamp(1.7rem, 5vw, 2.4rem);
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--ocre-suave);
      text-transform: uppercase;
    }

    .subtitle {
      color: var(--hueso-tenue);
      font-size: 0.98rem;
      max-width: 34rem;
      margin: 0.35rem auto 0;
    }

    /* ——— Panel de consulta ——— */
    .panel {
      background: var(--fondo-suave);
      border: 2px solid var(--ocre);
      clip-path: polygon(
        0 12px, 12px 12px, 12px 0,
        calc(100% - 12px) 0, calc(100% - 12px) 12px, 100% 12px,
        100% calc(100% - 12px), calc(100% - 12px) calc(100% - 12px), calc(100% - 12px) 100%,
        12px 100%, 12px calc(100% - 12px), 0 calc(100% - 12px)
      );
      padding: 1.35rem 1.2rem 1.5rem;
      margin-bottom: 1.75rem;
    }

    .panel-inner {
      border: 1px solid rgba(196, 163, 90, 0.35);
      padding: 1.1rem;
    }

    label {
      display: block;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--turquesa-clara);
      margin-bottom: 0.45rem;
    }

    textarea {
      width: 100%;
      min-height: 88px;
      resize: vertical;
      background: #0d0908;
      border: 2px solid rgba(196, 163, 90, 0.45);
      color: var(--hueso);
      font: inherit;
      font-size: 1.05rem;
      padding: 0.75rem 0.85rem;
      margin-bottom: 1.15rem;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--turquesa);
    }

    textarea::placeholder {
      color: rgba(242, 235, 224, 0.4);
    }

    .tiradas {
      display: grid;
      gap: 0.65rem;
      margin-bottom: 1.25rem;
    }

    .tirada-opt {
      display: flex;
      align-items: flex-start;
      gap: 0.7rem;
      cursor: pointer;
      padding: 0.7rem 0.8rem;
      border: 2px solid rgba(196, 163, 90, 0.3);
      background: rgba(0, 0, 0, 0.25);
      transition: border-color 0.2s, background 0.2s;
    }

    .tirada-opt:hover {
      border-color: var(--turquesa);
    }

    .tirada-opt:has(input:checked) {
      border-color: var(--cochinilla-clara);
      background: rgba(155, 27, 46, 0.18);
    }

    .tirada-opt input {
      appearance: none;
      width: 18px;
      height: 18px;
      margin-top: 2px;
      flex-shrink: 0;
      border: 2px solid var(--ocre);
      background: transparent;
      position: relative;
      cursor: pointer;
    }

    .tirada-opt input:checked::after {
      content: "";
      position: absolute;
      inset: 3px;
      background: var(--cochinilla-clara);
    }

    .tirada-opt strong {
      display: block;
      color: var(--ocre-suave);
      font-size: 1rem;
    }

    .tirada-opt span {
      display: block;
      font-size: 0.88rem;
      color: var(--hueso-tenue);
      margin-top: 0.15rem;
    }

    .acciones {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem;
    }

    button {
      font: inherit;
      font-size: 0.92rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      border: 2px solid var(--ocre);
      background: transparent;
      color: var(--hueso);
      padding: 0.7rem 1.15rem;
      clip-path: polygon(
        0 8px, 8px 8px, 8px 0,
        calc(100% - 8px) 0, calc(100% - 8px) 8px, 100% 8px,
        100% calc(100% - 8px), calc(100% - 8px) calc(100% - 8px), calc(100% - 8px) 100%,
        8px 100%, 8px calc(100% - 8px), 0 calc(100% - 8px)
      );
      transition: background 0.2s, color 0.2s, border-color 0.2s, transform 0.15s;
    }

    button:hover:not(:disabled) {
      background: var(--cochinilla);
      border-color: var(--cochinilla-clara);
      color: var(--hueso);
    }

    button:active:not(:disabled) {
      transform: translateY(1px);
    }

    button:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    button.primario {
      background: var(--cochinilla);
      border-color: var(--cochinilla-clara);
    }

    button.primario:hover:not(:disabled) {
      background: var(--cochinilla-clara);
    }

    button.secundario {
      border-color: var(--turquesa);
      color: var(--turquesa-clara);
    }

    button.secundario:hover:not(:disabled) {
      background: var(--turquesa);
      border-color: var(--turquesa-clara);
      color: var(--hueso);
    }

    /* ——— Zona de lectura ——— */
    .lectura {
      min-height: 120px;
      margin-bottom: 1.5rem;
    }

    .lectura-msg {
      text-align: center;
      color: var(--hueso-tenue);
      padding: 2rem 1rem;
      border: 1px dashed rgba(196, 163, 90, 0.35);
    }

    .pregunta-activa {
      text-align: center;
      margin-bottom: 1.25rem;
      font-style: italic;
      color: var(--ocre-suave);
      font-size: 1.05rem;
    }

    .nombre-tirada {
      text-align: center;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-size: 0.8rem;
      color: var(--turquesa-clara);
      margin-bottom: 1.1rem;
    }

    /* Layouts de cartas */
    .mesa {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.25rem 1rem;
      perspective: 1200px;
    }

    .mesa.tres-mundos {
      gap: 1.5rem 1.1rem;
    }

    .mesa.chakana {
      display: grid;
      grid-template-columns: var(--carta-w) var(--carta-w) var(--carta-w);
      grid-template-rows: auto auto auto;
      gap: 0.85rem 0.75rem;
      justify-content: center;
      width: max-content;
      max-width: 100%;
      margin: 0 auto;
    }

    .mesa.chakana .slot:nth-child(1) { grid-column: 2; grid-row: 1; }
    .mesa.chakana .slot:nth-child(2) { grid-column: 1; grid-row: 2; }
    .mesa.chakana .slot:nth-child(3) { grid-column: 2; grid-row: 2; }
    .mesa.chakana .slot:nth-child(4) { grid-column: 3; grid-row: 2; }
    .mesa.chakana .slot:nth-child(5) { grid-column: 2; grid-row: 3; }

    .slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.45rem;
    }

    .posicion {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--ocre);
      text-align: center;
      max-width: var(--carta-w);
      min-height: 2.2em;
    }

    /* Carta 3D */
    .carta {
      width: var(--carta-w);
      height: var(--carta-h);
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.75s cubic-bezier(0.4, 0.1, 0.2, 1);
      animation: barajar-entrada 0.55s ease both;
    }

    .carta:nth-child(1),
    .slot:nth-child(1) .carta { animation-delay: 0.05s; }
    .slot:nth-child(2) .carta { animation-delay: 0.12s; }
    .slot:nth-child(3) .carta { animation-delay: 0.19s; }
    .slot:nth-child(4) .carta { animation-delay: 0.26s; }
    .slot:nth-child(5) .carta { animation-delay: 0.33s; }

    @keyframes barajar-entrada {
      from {
        opacity: 0;
        transform: translateY(28px) rotateY(-18deg) scale(0.92);
      }
      to {
        opacity: 1;
        transform: translateY(0) rotateY(0) scale(1);
      }
    }

    .carta.revelada {
      animation: none;
      transform: rotateY(180deg);
    }

    .cara {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      overflow: hidden;
      clip-path: polygon(
        0 10px, 10px 10px, 10px 0,
        calc(100% - 10px) 0, calc(100% - 10px) 10px, 100% 10px,
        100% calc(100% - 10px), calc(100% - 10px) calc(100% - 10px), calc(100% - 10px) 100%,
        10px 100%, 10px calc(100% - 10px), 0 calc(100% - 10px)
      );
      box-shadow: 0 10px 28px var(--sombra);
    }

    .cara-reverso {
      background: #1a100c;
      border: 3px solid var(--cochinilla);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }

    .cara-reverso svg {
      width: 100%;
      height: 100%;
    }

    .cara-frente {
      background: linear-gradient(165deg, #2a1c14 0%, #18100c 55%, #221610 100%);
      border: 3px solid var(--ocre);
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.65rem 0.5rem 0.55rem;
      text-align: center;
    }

    .simbolo {
      width: 72px;
      height: 72px;
      margin: 0.15rem 0 0.35rem;
      color: var(--turquesa-clara);
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    .carta.invertida .simbolo {
      transform: rotate(180deg);
    }

    .simbolo svg {
      width: 100%;
      height: 100%;
    }

    .num-carta {
      font-size: 0.68rem;
      color: var(--ocre);
      letter-spacing: 0.08em;
    }

    .carta.invertida .num-carta {
      color: var(--cochinilla-clara);
    }

    .nombre-qh {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--ocre-suave);
      line-height: 1.15;
      margin-top: 0.1rem;
    }

    .traduccion {
      font-size: 0.72rem;
      color: var(--hueso-tenue);
      margin-top: 0.15rem;
      line-height: 1.2;
    }

    .badge-inv {
      margin-top: auto;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--cochinilla-clara);
      border: 1px solid var(--cochinilla);
      padding: 0.15rem 0.4rem;
      visibility: hidden;
    }

    .carta.invertida .badge-inv {
      visibility: visible;
    }

    /* Detalle de significado */
    .detalle {
      margin-top: 1.5rem;
      background: rgba(28, 20, 16, 0.92);
      border: 2px solid var(--turquesa);
      clip-path: polygon(
        0 12px, 12px 12px, 12px 0,
        calc(100% - 12px) 0, calc(100% - 12px) 12px, 100% 12px,
        100% calc(100% - 12px), calc(100% - 12px) calc(100% - 12px), calc(100% - 12px) 100%,
        12px 100%, 12px calc(100% - 12px), 0 calc(100% - 12px)
      );
      padding: 1.2rem 1.15rem;
      display: none;
      animation: aparecer 0.35s ease;
    }

    .detalle.visible {
      display: block;
    }

    @keyframes aparecer {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .detalle h2 {
      font-size: 1.35rem;
      color: var(--ocre-suave);
      margin-bottom: 0.15rem;
    }

    .detalle .meta {
      color: var(--hueso-tenue);
      font-size: 0.92rem;
      margin-bottom: 0.65rem;
    }

    .claves {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 0.85rem;
    }

    .clave {
      font-size: 0.75rem;
      letter-spacing: 0.04em;
      color: var(--fondo);
      background: var(--turquesa);
      padding: 0.2rem 0.55rem;
    }

    .orientacion {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 0.65rem;
      padding: 0.2rem 0.55rem;
      border: 1px solid var(--ocre);
      color: var(--ocre-suave);
    }

    .orientacion.inv {
      border-color: var(--cochinilla-clara);
      color: var(--cochinilla-clara);
    }

    .significado {
      color: var(--hueso);
      font-size: 1rem;
    }

    .pos-detalle {
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--turquesa-clara);
      margin-bottom: 0.35rem;
    }

    footer {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.25rem;
      border-top: 1px solid rgba(196, 163, 90, 0.35);
      font-size: 0.8rem;
      color: var(--hueso-tenue);
      max-width: 36rem;
      margin-left: auto;
      margin-right: auto;
    }

    @media (max-width: 560px) {
      :root {
        --carta-w: 118px;
        --carta-h: 190px;
      }

      .wrap {
        padding: 1rem 0.75rem 2rem;
      }

      .simbolo {
        width: 52px;
        height: 52px;
      }

      .nombre-qh {
        font-size: 0.8rem;
      }

      .traduccion {
        font-size: 0.62rem;
      }

      .mesa.chakana {
        gap: 0.55rem 0.45rem;
      }

      .mesa.tres-mundos {
        flex-direction: column;
        align-items: center;
      }

      button {
        flex: 1 1 auto;
        text-align: center;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .carta,
      .detalle,
      button {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M8 24h8v-8h8V8h8v8h8v8h-8v8h-8v8h-8v-8H8V24z" stroke="#c4a35a" stroke-width="2"/>
          <rect x="20" y="20" width="8" height="8" fill="#9b1b2e"/>
        </svg>
        <h1>Oráculo Andino</h1>
      </div>
      <p class="subtitle">
        Lectura de cartas de inspiración andina. Nombres en quechua con su sentido en español.
      </p>
    </header>

    <section class="panel" aria-label="Consulta">
      <div class="panel-inner">
        <label for="pregunta">Tu pregunta</label>
        <textarea
          id="pregunta"
          placeholder="Escribe aquí lo que deseas consultar…"
          maxlength="500"
        ></textarea>

        <label>Elige la tirada</label>
        <div class="tiradas" role="radiogroup" aria-label="Tipo de tirada">
          <label class="tirada-opt">
            <input type="radio" name="tirada" value="1" checked />
            <div>
              <strong>Carta del día</strong>
              <span>Una carta — orientación para el presente</span>
            </div>
          </label>
          <label class="tirada-opt">
            <input type="radio" name="tirada" value="3" />
            <div>
              <strong>Los tres mundos</strong>
              <span>Uku Pacha · Kay Pacha · Hanan Pacha</span>
            </div>
          </label>
          <label class="tirada-opt">
            <input type="radio" name="tirada" value="5" />
            <div>
              <strong>Chakana</strong>
              <span>Cruz andina: cuatro brazos y un centro</span>
            </div>
          </label>
        </div>

        <div class="acciones">
          <button type="button" class="primario" id="btn-barajar">Barajar</button>
          <button type="button" id="btn-nueva" disabled>Nueva lectura</button>
          <button type="button" class="secundario" id="btn-guardar" disabled>Guardar lectura</button>
        </div>
      </div>
    </section>

    <section class="lectura" id="lectura" aria-live="polite">
      <p class="lectura-msg">Escribe tu pregunta, elige una tirada y pulsa <strong>Barajar</strong>.</p>
    </section>

    <aside class="detalle" id="detalle" aria-live="polite"></aside>

    <footer>
      Oráculo de inspiración andina, con fines de orientación y entretenimiento. No sustituye asesoría profesional.
    </footer>
  </div>

  <script>
    (function () {
      "use strict";

      /* ——— 22 cartas ——— */
      const CARTAS = [
        {
          id: 0,
          nombre: "Chaski",
          traduccion: "el mensajero",
          claves: ["noticia", "llamado", "movimiento"],
          derecho: "Llega un mensaje, una invitación o una señal que no debes ignorar. Abre los caminos de comunicación y actúa con prontitud.",
          invertido: "Retrasos en las noticias o palabras malinterpretadas. Revisa a quién escuchas y no tomes decisiones con información incompleta."
        },
        {
          id: 1,
          nombre: "Paqo",
          traduccion: "el oficiante",
          claves: ["ritual", "intención", "sanación"],
          derecho: "Es momento de honrar lo sagrado en lo cotidiano. Una ofrenda, una palabra de gratitud o un acto consciente restablece el equilibrio.",
          invertido: "Rituales vacíos o promesas incumplidas. Recupera la sinceridad de tu intención antes de pedir o de ofrecer."
        },
        {
          id: 2,
          nombre: "Killa",
          traduccion: "la luna",
          claves: ["ciclos", "intuición", "emoción"],
          derecho: "Confía en tus ciclos internos. La intuición ilumina lo que la razón aún no nombra; honra el descanso y la receptividad.",
          invertido: "Confusión emocional o miedo a lo invisible. No niegues lo que sientes; dale forma con calma antes de actuar."
        },
        {
          id: 3,
          nombre: "Pachamama",
          traduccion: "la madre tierra",
          claves: ["sostén", "abundancia", "cuidado"],
          derecho: "La tierra responde: hay nutrición, hogar y fecundidad. Cuida lo que te sostiene y cultiva con paciencia lo que deseas cosechar.",
          invertido: "Descuido del cuerpo, del hogar o de la tierra. Restaura el cuidado mutuo antes de exigir más frutos."
        },
        {
          id: 4,
          nombre: "Sapa Inka",
          traduccion: "la autoridad",
          claves: ["liderazgo", "orden", "responsabilidad"],
          derecho: "Asume el mando con dignidad. Tu palabra tiene peso: organiza, decide y protege lo que te ha sido confiado.",
          invertido: "Autoritarismo o falta de dirección. El poder mal usado o abandonado genera desorden; recupera el equilibrio entre mando y servicio."
        },
        {
          id: 5,
          nombre: "Amauta",
          traduccion: "el maestro",
          claves: ["sabiduría", "enseñanza", "consejo"],
          derecho: "Aparece un maestro —o tú lo eres para otro—. Escucha con humildad y transmite lo aprendido sin vanidad.",
          invertido: "Orgullo intelectual o rechazo al aprendizaje. Baja la defensa y permite que la experiencia te corrija."
        },
        {
          id: 6,
          nombre: "Yanantin",
          traduccion: "la dualidad complementaria",
          claves: ["pareja", "equilibrio", "complemento"],
          derecho: "Dos fuerzas distintas se encuentran y se potencian. Busca la alianza, no la copia: la diferencia es tu riqueza.",
          invertido: "Polarización o dependencia. Cuando un polo domina al otro, el tejido se rompe; restablece el diálogo."
        },
        {
          id: 7,
          nombre: "Qhapaq Ñan",
          traduccion: "el gran camino",

      const TIRADAS = {

      let lecturaActual = null;

      const elPregunta = document.getElementById("pregunta");
      const elLectura = document.getElementById("lectura");
      const elDetalle = document.getElementById("detalle");
      const btnBarajar = document.getElementById("btn-barajar");
      const btnNueva = document.getElementById("btn-nueva");
      const btnGuardar = document.getElementById("btn-guardar");

      function barajarArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const t = a[i];
          a[i] = a[j];
          a[j] = t;
        }
        return a;
      }

      function tiradaSeleccionada() {
        const r = document.querySelector('input[name="tirada"]:checked');
        return Number(r ? r.value : 1);
      }

      function barajar() {
        const pregunta = elPregunta.value.trim();
        if (!pregunta) {
          elPregunta.focus();
          elPregunta.style.borderColor = "#c43a4a";
          setTimeout(() => { elPregunta.style.borderColor = ""; }, 1200);
          return;
        }

        const n = tiradaSeleccionada();
        const info = TIRADAS[n];
        const mazo = barajarArray(CARTAS);
        const sacadas = mazo.slice(0, n).map((carta, i) => ({
          carta,
          invertida: Math.random() < 0.5,
          posicion: info.posiciones[i],
          revelada: false
        }));

        lecturaActual = {
          pregunta,
          tirada: n,
          nombreTirada: info.nombre,
          cartas: sacadas,
          fecha: new Date()
        };

        renderMesa();
        elDetalle.classList.remove("visible");
        elDetalle.innerHTML = "";
        btnNueva.disabled = false;
        btnGuardar.disabled = false;
        btnBarajar.disabled = true;
        elPregunta.disabled = true;
        document.querySelectorAll('input[name="tirada"]').forEach((inp) => {
          inp.disabled = true;
        });
      }

      function renderMesa() {
        const L = lecturaActual;
        const claseMesa =
          L.tirada === 3 ? "mesa tres-mundos" :
          L.tirada === 5 ? "mesa chakana" : "mesa";

        let html = "";
        html += `<p class="pregunta-activa">«${escapar(L.pregunta)}»</p>`;
        html += `<p class="nombre-tirada">${escapar(L.nombreTirada)}</p>`;
        html += `<div class="${claseMesa}">`;

        L.cartas.forEach((item, index) => {
          const c = item.carta;
          const clases = [
            "carta",
            item.revelada ? "revelada" : "",
            item.invertida ? "invertida" : ""
          ].filter(Boolean).join(" ");

          html += `<div class="slot">`;
          html += `<div class="posicion">${escapar(item.posicion)}</div>`;
          html += `<div class="${clases}" data-index="${index}" role="button" tabindex="0" aria-label="Carta ${index + 1}: ${item.revelada ? c.nombre : "boca abajo"}">`;
          html += `<div class="cara cara-reverso">${REVERSO_SVG}</div>`;
          html += `<div class="cara cara-frente">`;
          html += `<span class="num-carta">${c.id}</span>`;
          html += `<div class="simbolo">${SIMBOLOS[c.id]}</div>`;
          html += `<div class="texto-carta">`;
          html += `<div class="nombre-qh">${escapar(c.nombre)}</div>`;
          html += `<div class="traduccion">${escapar(c.traduccion)}</div>`;
          html += `</div>`;
          html += `<span class="badge-inv">Invertida</span>`;
          html += `</div></div></div>`;
        });

        html += `</div>`;
        elLectura.innerHTML = html;

        elLectura.querySelectorAll(".carta").forEach((nodo) => {
          nodo.addEventListener("click", () => revelar(Number(nodo.dataset.index)));
          nodo.addEventListener("keydown", (e) => {
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              revelar(Number(nodo.dataset.index));
            }
          });
        });
      }

      function revelar(index) {
        if (!lecturaActual) return;
        const item = lecturaActual.cartas[index];
        if (!item.revelada) {
          item.revelada = true;
          const nodo = elLectura.querySelector(`.carta[data-index="${index}"]`);
          if (nodo) {
            nodo.classList.add("revelada");
            nodo.setAttribute(
              "aria-label",
              `Carta ${index + 1}: ${item.carta.nombre}${item.invertida ? " (invertida)" : ""}`
            );
          }
        }
        mostrarDetalle(index);
      }

      function mostrarDetalle(index) {
        const item = lecturaActual.cartas[index];
        const c = item.carta;
        const significado = item.invertida ? c.invertido : c.derecho;

        elDetalle.innerHTML = `
          <p class="pos-detalle">${escapar(item.posicion)}</p>
          <h2>${c.id}. ${escapar(c.nombre)}</h2>
          <p class="meta">${escapar(c.traduccion)}</p>
          <div class="claves">${c.claves.map((k) => `<span class="clave">${escapar(k)}</span>`).join("")}</div>
          <span class="orientacion ${item.invertida ? "inv" : ""}">${item.invertida ? "Invertida" : "Al derecho"}</span>
          <p class="significado">${escapar(significado)}</p>
        `;
        elDetalle.classList.add("visible");
        elDetalle.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }

      function nuevaLectura() {
        lecturaActual = null;
        elLectura.innerHTML = `<p class="lectura-msg">Escribe tu pregunta, elige una tirada y pulsa <strong>Barajar</strong>.</p>`;
        elDetalle.classList.remove("visible");
        elDetalle.innerHTML = "";
        btnNueva.disabled = true;
        btnGuardar.disabled = true;
        btnBarajar.disabled = false;
        elPregunta.disabled = false;
        elPregunta.value = "";
        document.querySelectorAll('input[name="tirada"]').forEach((inp) => {
          inp.disabled = false;
        });
        elPregunta.focus();
      }

      function guardarLectura() {
        if (!lecturaActual) return;
        const L = lecturaActual;
        const fecha = L.fecha.toLocaleString("es-ES", {
          dateStyle: "long",
          timeStyle: "short"
        });

        let texto = "ORÁCULO ANDINO — Lectura guardada\n";
        texto += "================================\n\n";
        texto += "Fecha: " + fecha + "\n";
        texto += "Tirada: " + L.nombreTirada + "\n";
        texto += "Pregunta: " + L.pregunta + "\n\n";

        L.cartas.forEach((item, i) => {
          const c = item.carta;
          const orient = item.invertida ? "Invertida" : "Al derecho";
          const sig = item.invertida ? c.invertido : c.derecho;
          texto += "--- Carta " + (i + 1) + " ---\n";
          texto += "Posición: " + item.posicion + "\n";
          texto += c.id + ". " + c.nombre + " (" + c.traduccion + ")\n";
          texto += "Orientación: " + orient + "\n";
          texto += "Claves: " + c.claves.join(", ") + "\n";
          if (item.revelada) {
            texto += "Significado: " + sig + "\n";
          } else {
            texto += "Significado: (carta aún no revelada)\n";
          }
          texto += "\n";
        });

        texto += "--------------------------------\n";
        texto += "Oráculo de inspiración andina, con fines de orientación y entretenimiento.\n";
        texto += "No sustituye asesoría profesional.\n";

        const blob = new Blob([texto], { type: "text/plain;charset=utf-8" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        const stamp = L.fecha.toISOString().slice(0, 10);
        a.href = url;
        a.download = "lectura-oraculo-andino-" + stamp + ".txt";
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      }

      function escapar(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      btnBarajar.addEventListener("click", barajar);
      btnNueva.addEventListener("click", nuevaLectura);
      btnGuardar.addEventListener("click", guardarLectura);
    })();
  </script>
</body>
</html>
